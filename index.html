<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plop — Bump into friends from your menu bar</title>
  <meta name="description" content="Bump into friends. Meet their friends. All from your menu bar.">
  <meta property="og:title" content="Plop">
  <meta property="og:description" content="Bump into friends. Meet their friends. All from your menu bar.">
  <meta property="og:type" content="website">
  <style>
    :root {
      --surface: rgba(255, 255, 255, 0.4);
      --border: rgba(255, 255, 255, 0.5);
      --text: #2d1a3a;
      --muted: #7a5870;
      --accent: #d6326b;
      --accent-bright: #ec4f8a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      /* Diagonal pastel sweep sampled from the app icon: lavender top-
         left, hot pastel pink middle, peach bottom-right. */
      background: linear-gradient(135deg, #e0c2ee 0%, #f5a8c2 55%, #fac4a4 100%);
      background-attachment: fixed;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1.25rem;
      text-align: center;
    }
    .wrap { max-width: 32rem; }
    h1 {
      margin: 0 0 0.5rem;
      line-height: 0;
      position: relative;
      isolation: isolate;
    }
    /* Magnetic glow — a soft pink/peach halo that tracks the cursor
       behind the wordmark on hover. */
    h1::before {
      content: '';
      position: absolute;
      inset: -60px;
      pointer-events: none;
      background: radial-gradient(
        circle 220px at var(--mx, 50%) var(--my, 50%),
        rgba(255, 120, 190, 0.6) 0%,
        rgba(255, 180, 130, 0.32) 35%,
        transparent 70%
      );
      filter: blur(26px);
      opacity: var(--glow-opacity, 0);
      transition: opacity 320ms ease-out;
      z-index: -1;
      border-radius: 50%;
    }
    /* Yellow magnetic glow — mirror image of the magenta glow, positioned
       at the cursor's inverse coordinates within the wordmark. */
    h1::after {
      content: '';
      position: absolute;
      inset: -60px;
      pointer-events: none;
      background: radial-gradient(
        circle 220px at calc(100% - var(--mx, 50%)) calc(100% - var(--my, 50%)),
        rgba(255, 230, 80, 0.6) 0%,
        rgba(255, 200, 120, 0.3) 35%,
        transparent 70%
      );
      filter: blur(26px);
      opacity: var(--glow-opacity, 0);
      transition: opacity 320ms ease-out;
      z-index: -1;
      border-radius: 50%;
    }
    h1 img {
      display: block;
      width: 100%;
      max-width: 22rem;
      height: auto;
      margin: 0 auto;
      transform: scale(var(--jelly-scale, 1))
                 skew(var(--jelly-skewx, 0deg), var(--jelly-skewy, 0deg));
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform;
    }
    @media (prefers-reduced-motion: reduce) {
      h1 img { transition: none; transform: none; }
      h1::before, h1::after { display: none; }
    }
    .tagline {
      color: var(--muted);
      font-size: 1.0625rem;
      line-height: 1.5;
      margin: 0 0 2.5rem;
    }
    .download {
      display: inline-flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.875rem 1.75rem;
      font-size: 1.0625rem;
      font-weight: 600;
      color: white;
      /* Hot-pink gradient mirroring the wordmark's bottom-stop magenta,
         which reads as a vibrant call-to-action against the pastel
         background without competing with the wordmark itself. */
      background: linear-gradient(180deg, rgba(236, 79, 138, 0.95) 0%, rgba(192, 38, 96, 0.95) 100%);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 9999px;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        0 8px 24px rgba(214, 50, 107, 0.35);
      transition: transform 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
    }
    .download:hover {
      transform: translateY(-1px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.35),
        0 10px 28px rgba(214, 50, 107, 0.5);
    }
    .download:active { transform: translateY(0); }
    .download[aria-disabled="true"] {
      opacity: 0.55;
      cursor: progress;
      pointer-events: none;
    }
    .download .icon {
      width: 1.125rem;
      height: 1.125rem;
      fill: currentColor;
    }
    .meta {
      margin-top: 1rem;
      font-size: 0.8125rem;
      color: var(--muted);
      min-height: 1.25rem;
    }
    .meta a {
      color: var(--muted);
      text-decoration: underline;
      text-decoration-color: rgba(45, 26, 58, 0.25);
      text-underline-offset: 2px;
    }
    .meta a:hover { color: var(--text); }
    .reqs {
      margin-top: 2rem;
      font-size: 0.8125rem;
      color: var(--muted);
    }
    .error {
      margin-top: 1rem;
      font-size: 0.875rem;
      color: #9b2c4a;
    }
    .error a { color: #9b2c4a; }
    footer {
      margin-top: 3rem;
      font-size: 0.75rem;
      color: rgba(45, 26, 58, 0.45);
    }
    footer a {
      color: inherit;
      text-decoration: none;
    }
    footer a:hover { color: var(--muted); }

    #stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .wrap { position: relative; z-index: 1; }
    .star {
      position: absolute;
      color: rgba(255, 255, 255, 0.92);
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.7));
      transform-origin: center;
      animation-name: twinkle;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      will-change: transform, opacity;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.55); }
      50%      { opacity: 1;    transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .star { animation: none; opacity: 0.55; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="sparkle" viewBox="0 0 100 100">
      <path d="M50 0 C51 38 52 47 58 49 C66 50.5 80 50.5 100 50 C80 49.5 66 49.5 58 51 C52 53 51 62 50 100 C49 62 48 53 42 51 C34 49.5 20 49.5 0 50 C20 50.5 34 50.5 42 49 C48 47 49 38 50 0 Z" fill="currentColor"/>
    </symbol>
  </svg>
  <div id="stars" aria-hidden="true"></div>

  <main class="wrap">
    <h1><img src="plop_wordmark_transparent.png" alt="Plop" /></h1>
    <p class="tagline">Bump into friends. Meet their friends. All from your menu bar.</p>

    <a id="dl" class="download" href="https://github.com/a18n/barge-releases/releases/latest" aria-disabled="true" download>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a1 1 0 0 1 1 1v9.59l3.3-3.3a1 1 0 1 1 1.4 1.42l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 0 1 1.4-1.42L11 13.6V4a1 1 0 0 1 1-1Zm-8 16a1 1 0 0 1 1-1h14a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1Z"/></svg>
      <span id="dl-label">Loading latest…</span>
    </a>

    <div class="meta" id="meta"></div>
    <div class="error" id="error" hidden></div>

    <p class="reqs">Requires macOS on Apple Silicon (M1 or later).</p>

    <footer>
      <a href="https://github.com/a18n/barge-releases/releases">All releases</a>
    </footer>
  </main>

  <script>
    (function () {
      // Jelly squish + magnetic glow on the wordmark.
      if (!window.matchMedia || !window.matchMedia('(hover: hover)').matches) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var h1 = document.querySelector('h1');
      var wm = h1 && h1.querySelector('img');
      if (!h1 || !wm) return;

      function reset() {
        wm.style.setProperty('--jelly-scale', '1');
        wm.style.setProperty('--jelly-skewx', '0deg');
        wm.style.setProperty('--jelly-skewy', '0deg');
        h1.style.setProperty('--glow-opacity', '0');
      }

      h1.addEventListener('mouseenter', function () {
        h1.style.setProperty('--glow-opacity', '1');
      });

      h1.addEventListener('mousemove', function (e) {
        var r = h1.getBoundingClientRect();
        var px = (e.clientX - r.left) / r.width;   // 0..1 across wordmark
        var py = (e.clientY - r.top) / r.height;
        var ox = Math.max(-1, Math.min(1, (px - 0.5) * 2)); // -1..1
        var oy = Math.max(-1, Math.min(1, (py - 0.5) * 2));

        // Magnetic glow position (in % of h1's box).
        h1.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
        h1.style.setProperty('--my', (py * 100).toFixed(1) + '%');

        // Jelly squish — gentle scale-up + skew toward cursor.
        wm.style.setProperty('--jelly-scale', '1.05');
        wm.style.setProperty('--jelly-skewx', (ox * 4).toFixed(2) + 'deg');
        wm.style.setProperty('--jelly-skewy', (-oy * 3).toFixed(2) + 'deg');
      });

      h1.addEventListener('mouseleave', reset);
    })();

    (function () {
      var container = document.getElementById('stars');
      if (!container) return;
      var SVG_NS = 'http://www.w3.org/2000/svg';
      // Density anchored to ~22 stars at 750×800 (looks balanced there);
      // scale linearly by viewport area with a min/max clamp.
      var REF_AREA = 750 * 800;
      var REF_COUNT = 22;
      // Central exclusion box (in viewport %) so stars don't crowd the card.
      var EX_W = 44, EX_H = 54;
      var exMinX = 50 - EX_W / 2, exMaxX = 50 + EX_W / 2;
      var exMinY = 50 - EX_H / 2, exMaxY = 50 + EX_H / 2;

      function spawnOne() {
        var x, y, tries = 0;
        do {
          x = Math.random() * 100;
          y = Math.random() * 100;
          tries++;
        } while (
          tries < 25 &&
          x > exMinX && x < exMaxX &&
          y > exMinY && y < exMaxY
        );
        var size = 10.4 + Math.random() * 28.6;
        var dur = 2.4 + Math.random() * 3.2;
        var delay = -Math.random() * dur;
        var svg = document.createElementNS(SVG_NS, 'svg');
        svg.setAttribute('class', 'star');
        svg.setAttribute('viewBox', '0 0 100 100');
        svg.style.left = x + '%';
        svg.style.top = y + '%';
        svg.style.width = size + 'px';
        svg.style.height = size + 'px';
        svg.style.animationDuration = dur.toFixed(2) + 's';
        svg.style.animationDelay = delay.toFixed(2) + 's';
        var use = document.createElementNS(SVG_NS, 'use');
        use.setAttribute('href', '#sparkle');
        svg.appendChild(use);
        container.appendChild(svg);
      }

      function fadeAndRemove(s) {
        // Snapshot the current rendered state so the transition starts
        // from wherever the twinkle happens to be, then fade smoothly to 0.
        s.setAttribute('data-fading', '1');
        var cs = getComputedStyle(s);
        var curOpacity = cs.opacity;
        var curTransform = cs.transform;
        s.style.animation = 'none';
        s.style.opacity = curOpacity;
        s.style.transform = curTransform === 'none' ? 'scale(1)' : curTransform;
        // Force a reflow so the frozen state lands before we transition.
        void s.offsetHeight;
        s.style.transition = 'opacity 1.1s ease-out, transform 1.1s ease-out';
        s.style.opacity = '0';
        s.style.transform = 'scale(0.4)';
        setTimeout(function () {
          if (s.parentNode) s.parentNode.removeChild(s);
        }, 1200);
      }

      function targetCount() {
        var area = window.innerWidth * window.innerHeight;
        var c = Math.round(REF_COUNT * (area / REF_AREA));
        return Math.max(10, Math.min(90, c));
      }

      function reseed() {
        var target = targetCount();
        var active = container.querySelectorAll('.star:not([data-fading])');
        var current = active.length;
        if (target > current) {
          for (var i = 0; i < target - current; i++) spawnOne();
        } else if (target < current) {
          // Pick (current - target) random active stars to fade out.
          var arr = Array.prototype.slice.call(active);
          for (var k = arr.length - 1; k > 0; k--) {
            var j = Math.floor(Math.random() * (k + 1));
            var tmp = arr[k]; arr[k] = arr[j]; arr[j] = tmp;
          }
          var toRemove = current - target;
          for (var m = 0; m < toRemove; m++) fadeAndRemove(arr[m]);
        }
      }

      reseed();

      var resizeTimer = null;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(reseed, 200);
      });
    })();

    (function () {
      var btn = document.getElementById('dl');
      var label = document.getElementById('dl-label');
      var meta = document.getElementById('meta');
      var err = document.getElementById('error');

      function fmtDate(iso) {
        try {
          return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        } catch (e) { return ''; }
      }

      fetch('https://api.github.com/repos/a18n/barge-releases/releases/latest', {
        headers: { 'Accept': 'application/vnd.github+json' }
      })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (release) {
          var asset = (release.assets || []).find(function (a) {
            return /\.dmg$/i.test(a.name) && /arm64/i.test(a.name);
          });
          if (!asset) throw new Error('No DMG asset found on latest release');

          btn.href = asset.browser_download_url;
          btn.removeAttribute('aria-disabled');
          label.textContent = 'Plop';

          var version = release.tag_name || release.name || '';
          var date = fmtDate(release.published_at || release.created_at);
          meta.innerHTML = '<span>' + (version ? version + ' · ' : '') + (date || '') + '</span>' +
            ' · <a href="' + (release.html_url || 'https://github.com/a18n/barge-releases/releases/latest') + '">release notes</a>';
        })
        .catch(function (e) {
          label.textContent = 'Plop from GitHub';
          btn.removeAttribute('aria-disabled');
          err.hidden = false;
          err.innerHTML = "Couldn't auto-fetch the latest version. <a href=\"https://github.com/a18n/barge-releases/releases/latest\">Open the releases page</a>.";
        });
    })();
  </script>
</body>
</html>
